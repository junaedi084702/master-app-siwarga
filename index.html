<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SIWARGA</title>

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- =======================================================
LOGIN PAGE
======================================================= -->

<div id="loginPage">

    <div class="login-box">


        <!-- ==================================================
        HALAMAN AWAL
        ================================================== -->

        <div id="halamanAwal">

            <!-- LOGO DINAMIS -->
            <img
                id="logoLogin"
                src=""
                style="
                    width:160px;
                    max-width:70%;
                    height:auto;
                    display:none;
                    margin:0 auto 20px auto;
                ">

            <h2>SIWARGA</h2>

            <p>Sistem Iuran Warga</p>

            <br>

            <button
                class="btnLoginUtama"
                onclick="pilihLogin('warga')">

                👤 LOGIN WARGA

            </button>

            <br><br>

            <button
                class="btnLoginUtama"
                onclick="pilihLogin('admin')">

                🔐 LOGIN ADMIN

            </button>

        </div>



        <!-- ==================================================
        LOGIN WARGA - NOMOR HP
        ================================================== -->

        <div
            id="formWarga"
            style="display:none;">

            <h2>LOGIN WARGA</h2>

            <p>Masukkan Nomor HP</p>

            <input
                type="text"
                id="hpLogin"
                placeholder="Nomor HP">

            <button onclick="cekLoginWarga()">

                LANJUT

            </button>

            <br><br>

            <button onclick="kembaliAwal()">

                ← Kembali

            </button>

        </div>



        <!-- ==================================================
        AKTIVASI AKUN WARGA
        ================================================== -->

        <div
            id="formAktivasi"
            style="display:none;">

            <h2>AKTIVASI AKUN</h2>

            <p>Buat Password Baru</p>

            <input
                type="password"
                id="pass1"
                placeholder="Password Baru">

            <input
                type="password"
                id="pass2"
                placeholder="Konfirmasi Password">

            <button onclick="simpanPasswordBaru()">

                SIMPAN PASSWORD

            </button>

            <br><br>

            <button onclick="kembaliAwal()">

                ← Kembali

            </button>

        </div>



        <!-- ==================================================
        LOGIN WARGA - PASSWORD
        ================================================== -->

        <div
            id="formPassword"
            style="display:none;">

            <h2>LOGIN WARGA</h2>

            <p>Masukkan Password</p>


            <!-- PASSWORD + TAMPIL / SEMBUNYIKAN -->

            <div
                style="
                    position:relative;
                    width:100%;
                ">

                <input
                    type="password"
                    id="passwordWarga"
                    placeholder="Password"
                    style="
                        width:100%;
                        box-sizing:border-box;
                        padding-right:55px;
                        margin:0;
                    ">

                <span
                    id="mataPasswordWarga"
                    onclick="togglePasswordWarga()"
                    style="
                        position:absolute;
                        right:16px;
                        top:50%;
                        transform:translateY(-50%);
                        cursor:pointer;
                        font-size:20px;
                        line-height:1;
                        z-index:999;
                        user-select:none;
                    ">

                    👁️

                </span>

            </div>


            <button onclick="loginWarga()">

                LOGIN

            </button>

            <br><br>

            <a
                href="#"
                onclick="lupaPassword();return false;">

                Lupa Password?

            </a>

            <br><br>

            <button onclick="kembaliAwal()">

                ← Kembali

            </button>

        </div>



        <!-- ==================================================
        LOGIN ADMIN
        ================================================== -->

        <div
            id="formLogin"
            style="display:none;">

            <h2>LOGIN ADMIN</h2>

            <p>Administrator</p>

            <input
                type="text"
                id="username"
                placeholder="Username">

            <input
                type="password"
                id="password"
                placeholder="Password">

            <button onclick="login()">

                LOGIN

            </button>

            <br><br>

            <button onclick="kembaliAwal()">

                ← Kembali

            </button>

            <div id="pesan"></div>

        </div>


    </div>

</div>


<div id="dashboardPage" style="display:none;">

<div class="header">

    <h2>SIWARGA</h2>

    <button onclick="logout()">Logout</button>

</div>


<div class="menu" id="menuUtama">

    <button id="btnDashboard" onclick="menuDashboard()">
        🏠 Dashboard
    </button>

    <button id="btnWarga" onclick="menuWarga()">
        👥 Data Warga
    </button>

    <button id="btnPembayaran" onclick="menuPembayaran()">
        💰 Pembayaran
    </button>

    <button id="btnTools" onclick="menuTools()">
        🧰 Tools
    </button>

</div>


<div id="content">

    <div class="card">

        <h3>Total Warga</h3>

        <div id="jmlWarga">0</div>

    </div>

    <div class="card">

        <h3>Total Pembayaran</h3>

        <div id="jmlBayar">0</div>

    </div>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
