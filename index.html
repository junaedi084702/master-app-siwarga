<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIWARGA</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:400px;
  background:white;
  padding:35px;
  border-radius:16px;
  box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.judul{
  text-align:center;
  margin-bottom:30px;
}

.judul h1{
  margin:0;
  font-size:32px;
}

.judul p{
  margin:8px 0 0;
  color:#666;
}

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

input:focus{
  outline:none;
  border-color:#1565c0;
}

button{
  width:100%;
  padding:13px;
  background:#1565c0;
  color:white;
  border:0;
  border-radius:8px;
  font-size:17px;
  cursor:pointer;
}

button:hover{
  background:#0d47a1;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#pesan{
  margin-top:20px;
  text-align:center;
  font-weight:bold;
  min-height:22px;
}

.info-login{
  margin-top:25px;
  padding-top:18px;
  border-top:1px solid #eee;
  text-align:center;
  font-size:13px;
  color:#888;
}

</style>

</head>

<body>

<div class="login-card">

  <div class="judul">

    <h1>SIWARGA</h1>

    <p>Sistem Informasi Warga</p>

  </div>


  <form id="formLogin">

    <div class="form-group">

      <label>Username</label>

      <input
        type="text"
        id="username"
        autocomplete="username"
        required>

    </div>


    <div class="form-group">

      <label>Password</label>

      <input
        type="password"
        id="password"
        autocomplete="current-password"
        required>

    </div>


    <button
      type="submit"
      id="btnLogin">

      Masuk

    </button>

  </form>


  <div id="pesan"></div>


  <div class="info-login">

    MASTER APP SIWARGA

  </div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbw79fGykf4WCt5Ubj3KnmUVhsTMNLof94I1EzKNK2R5qKF6UehPV0BWOGbgJgKpSgku6A/exec";


document
  .getElementById("formLogin")
  .addEventListener("submit", login);


async function login(e){

  e.preventDefault();


  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value.trim();

  const pesan =
    document.getElementById("pesan");

  const tombol =
    document.getElementById("btnLogin");


  if(!username || !password){

    pesan.innerHTML =
      "⚠️ Username dan password wajib diisi";

    return;

  }


  tombol.disabled = true;

  tombol.innerHTML =
    "Memeriksa...";

  pesan.innerHTML =
    "Menghubungkan ke server...";


  try{

    const response =
      await fetch(API_URL,{

        method:"POST",

        headers:{
          "Content-Type":"text/plain;charset=utf-8"
        },

        body:JSON.stringify({

          api:"login",

          username:username,

          password:password

        })

      });


    const hasil =
      await response.json();


    console.log("HASIL LOGIN:",hasil);


    if(hasil.status){

      pesan.innerHTML =
        "✅ Login berhasil — " +
        hasil.user.nama;


      /*
      Simpan sementara informasi login.
      Password TIDAK disimpan.
      */

      sessionStorage.setItem(
        "siwarga_user",
        JSON.stringify(hasil.user)
      );


      tombol.innerHTML =
        "Login Berhasil";


    }else{

      pesan.innerHTML =
        "❌ " +
        (hasil.pesan ||
         "Username atau password salah");

      tombol.disabled = false;

      tombol.innerHTML =
        "Masuk";

    }


  }catch(error){

    console.error(error);

    pesan.innerHTML =
      "❌ Gagal menghubungi server";

    tombol.disabled = false;

    tombol.innerHTML =
      "Masuk";

  }

}

</script>

</body>
</html>
